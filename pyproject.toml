[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youkai"
version = "1.0.6"
description = "ZZZ inventory OCR scanner — exports ZodExport/eZOD JSON"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3",
    "rapidfuzz>=3.6",
    "pywin32>=306; sys_platform == 'win32'",
    "dxcam>=0.3; sys_platform == 'win32'",
    "pynput>=1.7",
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
youkai = "youkai_ocr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youkai_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
