[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youkai-ocr"
version = "0.1.0"
description = "ZZZ inventory OCR scanner — exports ZodExport/GOOD JSON"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3",
    "rapidfuzz>=3.6",
    "pywin32>=306; sys_platform == 'win32'",
    "dxcam>=0.3; sys_platform == 'win32'",
    "pynput>=1.7",
    "Pillow>=10.0",
]

[project.scripts]
youkai-ocr = "youkai_ocr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youkai_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
