name: Build (dry-run)

on:
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "packaging/**"
      - "src/**"
      - "youkai/**"
      - "pyproject.toml"
      - "**/*.spec"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows portable build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Derived version: $v"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -e ".[dev]" pyinstaller

      - name: Set up Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-01
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "youkai -> target"

      - name: Cache Tesseract
        uses: actions/cache@v4
        with:
          path: dist/youkai-ocr/tesseract
          key: tesseract-w64-v1-${{ hashFiles('packaging/get_tesseract.ps1') }}

      - name: Install Tesseract (elevated, avoids NSIS UAC detach)
        shell: pwsh
        run: choco install tesseract --no-progress -y

      - name: Build portable bundle
        shell: pwsh
        run: |
          & packaging\ci_build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkai-portable-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: youkai-portable-${{ steps.version.outputs.version }}.zip
          retention-days: 7
