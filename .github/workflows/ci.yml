name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  python-test:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

  rust-check:
    name: Rust check (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-01
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "youkai -> target"

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path youkai/Cargo.toml

      - name: cargo clippy
        run: >
          cargo clippy --release --manifest-path youkai/Cargo.toml
          -- -Dwarnings

      - name: cargo test
        run: cargo test --release --manifest-path youkai/Cargo.toml

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version strings agree
        run: python scripts/check_versions.py
