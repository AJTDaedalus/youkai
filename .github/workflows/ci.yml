name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests (including golden accuracy gate)
        run: pytest -q --tb=short
