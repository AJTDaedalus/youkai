[package]
name = "youkai"
version = "1.0.7"
authors = ["Konkers <konkers@konkers.net>"]
edition = "2024"
include = ["LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.42"
eframe = { version = "0.34", default-features = false, features = [
	"accesskit",
	"default_fonts",
	"glow",
	"persistence",
	"wayland",
	"x11",
] }
egui = "0.34"
egui-file-dialog = "0.13.0"
egui-notify = "0.22.0"
egui_extras = { version = "0.34", features = ["image", "svg", "webp"] }
egui_material_icons = "0.6.0"
open = "5.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["alloc"] }
tracing = { version = "0.1.41" }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1.23"

[profile.release]
opt-level = 2

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
