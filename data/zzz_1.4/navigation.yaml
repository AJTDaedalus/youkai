# ZZZ inventory navigation map — version 1.4 (English PC client)
# Reference resolution: 1920×1080 windowed
# All coordinates are in game-area pixels (origin = top-left of game window, NOT the OS window border)
# Raw screenshot is 1922×1112; subtract (x=1, y=32) to convert to game-area coords.
# Captured: 2026-06-01
# References: screenshots/reference_1..8

meta:
  game_version: "1.4"
  reference_resolution: [1920, 1080]
  screenshot_offset: [1, 32]    # raw → game coords
  capture_date: "2026-06-01"
  updated: "2026-06-11"   # H7a: added bottom_nav centres + screen_signatures from ref_11/12

  oq_status:
    OQ-ocr-4: resolved     # all panel geometries confirmed
    OQ-ocr-7: resolved     # PORTRAIT-ONLY: small circular face portrait appears to the right
                           # of the slot badge when equipped; ABSENT when not equipped.
                           # See location_detection note below.
  location_detection: >
    NOTE (D21): portrait template matching (A3) is risky at the ~30px circle size.
    Primary recommended approach: scan agent Equipment tab (ref_7/8) per agent to
    cross-reference disc/engine stats → set location. See DECISIONS.md D21.
    A3 portrait templates are still built as a fallback, but Equipment-tab
    cross-reference is the primary location-detection path.

# ─────────────────────────────────────────────
# STORAGE CATEGORY TABS
# ─────────────────────────────────────────────
# STORAGE CATEGORY TABS
# ─────────────────────────────────────────────
# Horizontal row of 4 circular tab buttons at the top of the right panel.
# (NOT vertical pills on the right edge — earlier description was wrong.)
# Measured 2026-06-11 from reference_1 (disc active) and reference_2 (engine active)
# using active-circle centroid analysis.
#
# Tab circle button centers (game-area coords) — use these for click targeting:
#   W-Engine:   (1447, 169)  circle spans game x=1413-1479, y=128-209
#   Drive Disc: (1535, 169)  circle spans game x=1450-1619, y=128-210
#
# Detection: active_storage_tab() uses glow_bbox luma comparison.
# glow_bbox[0] samples the left edge of the W-Engine circle (bright yellow when active).
# glow_bbox[1] coincidentally detects a secondary detail-panel brightness change
#   at game y=304-325 that correlates with Drive Disc being active — not the
#   tab circle itself, but discrimination is 3.9× so it works reliably.
storage_tabs:
  glow_column_x: [1413, 1430]    # game-area x range of W-Engine tab left edge (detection only)
  active_luma_threshold: 50      # mean luma > this → tab is active

  tabs:
    - index: 0
      label: "W-Engine"
      click_center: [1447, 169]
      glow_bbox: [1413, 135, 1430, 203]   # active in ref_2: yellow [213,207,0] luma≈140
    - index: 1
      label: "Drive Disc"
      click_center: [1535, 169]
      glow_bbox: [1413, 304, 1430, 325]   # secondary effect: disc_active≈112, engine_active≈29
    # Tabs 2 and 3 are visible but unused (filter icon, clock icon).

# ─────────────────────────────────────────────
# GRID (shared geometry — disc and engine inventories use identical layout)
# ─────────────────────────────────────────────
shared_grid: &shared_grid
  columns: 9
  rows_visible: 4
  col_pitch: 135          # px between column centers
  row_pitch: 175          # px between row centers (measured from "Lv." text clusters)
  cell_0_0_center: [166, 242]   # [x, y] of top-left cell center
  grid_bbox: [98, 155, 1315, 865]
  cell_half_size: [67, 87]      # half-width, half-height for click targeting

# ─────────────────────────────────────────────
# DRIVE DISC INVENTORY  (ref_1, ref_5)
# ─────────────────────────────────────────────
disc_inventory:
  # Navigation is NOT automated. User must manually open this screen before starting a scan.
  # (Mirrors AdeptiScanner-ZZZ approach — confirmed from source review 2026-06-02.)
  nav_path: "MANUAL — user opens Inventory → Drive Discs before running scanner"
  title_anchor: "Drive Disc Storage"    # text visible at top-left; used to confirm correct screen

  grid: *shared_grid    # same geometry as engine inventory

  sort:
    recommended_sort: "TODO — confirm sort key during live session"

  scroll:
    # Grid traversal: synthetic mouse CLICKS on each cell center (NOT arrow keys —
    # confirmed non-functional in ZZZ). Clicking the bottom-most visible row triggers
    # game auto-scroll. Scroll completion detected by screenshot hash comparison.
    method: mouse_click_cells
    scroll_trigger: click_bottom_row
    scroll_complete_detection: screenshot_hash_diff
    scroll_wait_ms: 1500
    end_detection: "no hash change after clicking bottom row = end of inventory"

  # Pressing Esc during scan halts automation (S-OCR-3 kill-switch)
  kill_key: Escape

  detail_panel:
    # Active when any grid cell is selected. Coordinates in game-area px at 1920×1080.
    panel_bbox: [1421, 100, 1860, 870]

    fields:
      # ── Identity ───────────────────────────────────────────
      # Full title text is "<SetName> [<slot>]", e.g. "Notes From the Chained [1]"
      # Strip the trailing " [N]" suffix to get the pure set name for fuzzy-matching.
      set_name_with_slot:
        bbox: [1421, 270, 1660, 385]
        preprocess: white_text_on_dark

      # Small circular slot badge below the title (white digit on dark circle).
      # Cross-check for the slot number extracted from set_name_with_slot.
      slot_badge:
        bbox: [1421, 338, 1453, 413]
        preprocess: white_text_on_dark

      # Equipped-agent indicator: small round portrait to the right of the slot badge.
      # PRESENT (brightness > threshold) → disc is equipped; match against portrait templates.
      # ABSENT (dark zone) → disc is unequipped; location = "".
      # bbox covers the portrait circle area only.
      equipped_portrait:
        bbox: [1453, 338, 1513, 413]
        preprocess: portrait_circle
        note: "OQ-ocr-7 resolved. Primary location detection via Equipment-tab scan (D21)."

      # ── Rarity & level ─────────────────────────────────────
      # Gold/purple/blue circle with "S"/"A"/"B" letter → identify by circle background color.
      rarity_badge:
        bbox: [1421, 402, 1452, 436]
        preprocess: color_sample
        colors: {S: [228, 165, 54], A: [160, 80, 220], B: [80, 140, 200]}

      # "Lv. 15/15" — read the first integer only (current level).
      level:
        bbox: [1451, 402, 1582, 436]
        preprocess: white_text_on_dark

      # ── Main stat ──────────────────────────────────────────
      main_stat_name:
        bbox: [1421, 490, 1720, 527]
        preprocess: white_text_on_dark

      main_stat_value:
        bbox: [1720, 490, 1855, 527]
        preprocess: white_text_on_dark

      # ── Sub-stats (up to 4 rows) ───────────────────────────
      # Name field contains orange "+N" upgrade-count suffix — strip it before matching.
      substat_1:
        name_bbox:  [1421, 566, 1760, 607]
        value_bbox: [1760, 566, 1855, 607]
        preprocess: white_text_on_dark

      substat_2:
        name_bbox:  [1421, 617, 1760, 658]
        value_bbox: [1760, 617, 1855, 658]
        preprocess: white_text_on_dark

      substat_3:
        name_bbox:  [1421, 668, 1760, 709]
        value_bbox: [1760, 668, 1855, 709]
        preprocess: white_text_on_dark

      substat_4:
        name_bbox:  [1421, 720, 1760, 760]
        value_bbox: [1760, 720, 1855, 760]
        preprocess: white_text_on_dark

      # ── Lock state ─────────────────────────────────────────
      # Padlock icon — template-match locked vs unlocked.
      lock_icon:
        bbox: [1421, 820, 1472, 862]
        preprocess: template_match

# ─────────────────────────────────────────────
# W-ENGINE INVENTORY  (ref_2, ref_6)
# ─────────────────────────────────────────────
engine_inventory:
  nav_path: "MANUAL — user opens Inventory → W-Engines before running scanner"
  title_anchor: "W-Engine Storage"

  grid: *shared_grid    # identical 9-col / 175px-pitch geometry confirmed

  sort:
    recommended_sort: "TODO"

  scroll:
    method: mouse_click_cells
    scroll_trigger: click_bottom_row
    scroll_complete_detection: screenshot_hash_diff
    scroll_wait_ms: 1500
    end_detection: "no hash change after clicking bottom row = end of inventory"

  kill_key: Escape

  detail_panel:
    panel_bbox: [1421, 100, 1860, 870]

    fields:
      engine_name:
        bbox: [1421, 270, 1760, 368]
        preprocess: white_text_on_dark

      # Small round portrait(s) directly below the engine name.
      # Equipped engine shows one agent portrait; unequipped shows none.
      # Same detection logic as disc equipped_portrait.
      equipped_portrait:
        bbox: [1421, 368, 1510, 408]
        preprocess: portrait_circle

      rarity_badge:
        bbox: [1421, 402, 1452, 436]
        preprocess: color_sample
        colors: {S: [228, 165, 54], A: [160, 80, 220], B: [80, 140, 200]}

      # "Lv. 60/60" — read current level (first integer).
      level:
        bbox: [1451, 402, 1582, 436]
        preprocess: white_text_on_dark

      # Refinement stars: ★★☆☆☆ → read filled stars = refinement 1-5.
      # Stars appear to the right of the level text (y≈402-436, x≈1582-1770).
      refinement_stars:
        bbox: [1582, 402, 1770, 436]
        preprocess: star_count

      # "Base ATK   684" — primary stat, always ATK for W-Engines.
      base_atk_value:
        bbox: [1720, 490, 1855, 527]
        preprocess: white_text_on_dark

      # Secondary stat — name varies by engine (Impact, PEN Ratio, CRIT Rate, etc.)
      secondary_stat_name:
        bbox: [1421, 565, 1720, 603]
        preprocess: white_text_on_dark

      secondary_stat_value:
        bbox: [1720, 565, 1855, 603]
        preprocess: white_text_on_dark

      # W-Engine effect label — e.g. "Passionate Construction", "Data Flood".
      # Read the label line; the full effect body is not needed for ZOD output.
      effect_label:
        bbox: [1421, 740, 1760, 775]
        preprocess: white_text_on_dark

      lock_icon:
        bbox: [1421, 820, 1472, 862]
        preprocess: template_match

# ─────────────────────────────────────────────
# AGENT ROSTER  (ref_3, ref_4, ref_7, ref_8)
# ─────────────────────────────────────────────
agent_roster:
  nav_path: "TODO — record from live session"

  # Detail-page top agent strip (H8 traversal).  We do NOT click portraits to select;
  # we click the "<"/">" chevrons at the ends of the bar to move the selection ±1, and
  # confirm each move by a pHash change over the portrait band (no silent skips).
  # RE-MEASURED FROM LIVE 2026-06-07 (H11) on agent_000/base_stats.png:
  #   bar spans ref x≈1005–1810 at y≈28–72; "<" glyph center (1025,44), ">" (1775,44);
  #   portrait thumbnails fill x≈1045–1745.
  # The previous H8 estimates ("<"@1140, ">"@1745) landed ON portraits, not the chevrons.
  roster_strip:
    bbox: [1005, 28, 1810, 72]
    prev_chevron: [1025, 44]      # "<" previous agent
    next_chevron: [1775, 44]      # ">" next agent
    phash_band:   [1045, 28, 1750, 72]   # portrait band — identity hash for move-confirm
    note: "Click chevrons (not portraits). Confirm each move via phash_band Hamming change."

  # Agent-menu entry button: the left-side "Base" pill opens the detail page for the
  # currently-previewed agent.  Re-centered from live 2026-06-07 (H11).
  menu_base_button: [1140, 816]

  # ── Base Stats tab (ref_3) ────────────────────────────────
  # Tab bar measured 2026-06-05 from live archive (agent_000/base_stats.png):
  # Active (yellow) Base Stats button: x=1011-1294, y=964-1028, center (1152, 996).
  # Skills text x=1362-1445; Equipment text x=1569-1738. Equal-width tabs.
  base_stats_tab:
    tab_label: "Base Stats"
    tab_bbox: [1011, 964, 1294, 1028]   # measured; yellow when active

    fields:
      # Faction name in small text above the agent name.
      faction:
        bbox: [955, 228, 1730, 260]
        preprocess: white_text_on_dark

      # Agent display name (large bold white text). Fuzzy-match → ZOD key.
      agent_name:
        bbox: [955, 278, 1350, 330]
        preprocess: white_text_on_dark

      # Promotion dots/stars below the agent name (filled = unlocked promotion).
      # ZOD field: ascension (0-6).
      # TODO: confirm visual appearance of promotion indicator in live session.
      ascension_dots:
        bbox: [955, 332, 1350, 360]
        preprocess: TODO

      # "Lv. 60" — current level. The greyed-out "60" to the right is the cap.
      level:
        bbox: [955, 452, 1100, 497]
        preprocess: white_text_on_dark

      # "MAX" badge — present when at max promotion level.
      max_badge:
        bbox: [1100, 455, 1175, 495]
        preprocess: white_text_on_dark

      # Element badge: "Ice", "Fire", etc.
      element:
        bbox: [1200, 499, 1355, 535]
        preprocess: white_text_on_dark

      # Specialty badge: "Defense", "Attack", "Anomaly", etc.
      specialty:
        bbox: [1355, 499, 1560, 535]
        preprocess: white_text_on_dark

      # Stats grid — 5 rows × 2 columns.
      # Left column (stat name + value), right column (stat name + value).
      # Row bboxes are approximate; refine in B1 with real frames.
      stats:
        hp:
          bbox: [955, 585, 1415, 618]
          preprocess: white_text_on_dark
        atk:
          bbox: [1415, 585, 1895, 618]
          preprocess: white_text_on_dark
        def:
          bbox: [955, 635, 1415, 668]
          preprocess: white_text_on_dark
        impact:
          bbox: [1415, 635, 1895, 668]
          preprocess: white_text_on_dark
        crit_rate:
          bbox: [955, 690, 1415, 720]
          preprocess: white_text_on_dark
        crit_dmg:
          bbox: [1415, 690, 1895, 720]
          preprocess: white_text_on_dark
        anomaly_mastery:
          bbox: [955, 745, 1415, 775]
          preprocess: white_text_on_dark
        anomaly_proficiency:
          bbox: [1415, 745, 1895, 775]
          preprocess: white_text_on_dark
        pen_ratio:
          bbox: [955, 800, 1415, 838]
          preprocess: white_text_on_dark
        energy_regen:
          bbox: [1415, 800, 1895, 838]
          preprocess: white_text_on_dark

      # "Fully Equipped" indicator — present when all 6 disc slots + engine are filled.
      fully_equipped:
        bbox: [955, 856, 1230, 890]
        preprocess: white_text_on_dark

  # ── Skills tab (ref_4) ────────────────────────────────────
  skills_tab:
    tab_label: "Skills"
    tab_bbox: [1294, 964, 1577, 1028]    # estimated from equal-width spacing; text at x=1362-1445

    fields:
      # Mindscape Cinema counter — "CINEMA N/6" shown bottom-left of character art.
      # N = number of cinema nodes unlocked (= ZOD constellation 0-6).
      mindscape_cinema:
        bbox: [35, 980, 200, 1030]
        preprocess: white_text_on_dark
        note: "Read the first integer (0-6) from 'CINEMA N/6' label."

      # Core Passive nodes: A-F hexagonal grid.
      # Each node is either lit (teal glow) or dark. Count lit nodes = core rank (0-6).
      # Positions are approximate — the grid is centered in the right half of the screen.
      core_nodes:
        A: {bbox: [965, 178, 1120, 350], preprocess: brightness_threshold}
        B: {bbox: [965, 270, 1120, 415], preprocess: brightness_threshold}
        C: {bbox: [1140, 178, 1310, 350], preprocess: brightness_threshold}
        D: {bbox: [1140, 270, 1310, 415], preprocess: brightness_threshold}
        E: {bbox: [1325, 178, 1490, 350], preprocess: brightness_threshold}
        F: {bbox: [1325, 270, 1490, 415], preprocess: brightness_threshold}
        note: "A-F order matches ZZZ unlock sequence. Highest lit node = core rank."

      # 5 skill icons in a row below the A-F grid. Order: Basic, Dodge, Assist, Special, Chain.
      # Level number appears below/on each icon.
      skill_icons:
        basic_attack:
          bbox: [920, 430, 1035, 540]
          level_bbox: [920, 510, 1035, 545]
          preprocess: white_text_on_dark
        dodge:
          bbox: [1040, 430, 1155, 540]
          level_bbox: [1040, 510, 1155, 545]
          preprocess: white_text_on_dark
        assist:
          bbox: [1160, 430, 1275, 540]
          level_bbox: [1160, 510, 1275, 545]
          preprocess: white_text_on_dark
        special_attack:
          bbox: [1280, 430, 1395, 540]
          level_bbox: [1280, 510, 1395, 545]
          preprocess: white_text_on_dark
        chain_attack:
          bbox: [1400, 430, 1515, 540]
          level_bbox: [1400, 510, 1515, 545]
          preprocess: white_text_on_dark

  # ── Equipment tab (ref_7, ref_8) — PRIMARY location-detection path ────
  # Navigate here after reading base stats + skills to map equipped items → location field.
  equipment_tab:
    tab_label: "Equipment"
    tab_bbox: [1577, 964, 1900, 1028]    # estimated from equal-width spacing; text at x=1569-1738

    # 6 disc slots arranged around the W-Engine center.
    # RE-MEASURED FROM LIVE 2026-06-07 (H11) and VALIDATED against reference_7/15/16
    # (H12) — all four sources place the discs at the SAME compact positions (HoughCircles
    # ring centers agree to ±2px; x-span 1137–1662).  The old "wide" coords (1088–1785)
    # were simply WRONG: they passed the prior saturation test only by landing on the
    # colorful background filmstrip art in ref_7, not on the discs.  The hexagon does NOT
    # move between the equipment tab (ref_16) and the disc-select view (ref_15), so this
    # one coordinate set covers all 7 slot clicks.  See DECISIONS.md D30.
    disc_slots:
      slot_1: {center: [1558, 318], bbox: [1478, 238, 1638, 398]}   # upper-right
      slot_2: {center: [1662, 538], bbox: [1582, 458, 1742, 618]}   # right-center
      slot_3: {center: [1559, 760], bbox: [1479, 680, 1639, 840]}   # lower-right
      slot_4: {center: [1239, 761], bbox: [1159, 681, 1319, 841]}   # lower-left
      slot_5: {center: [1137, 539], bbox: [1057, 459, 1217, 619]}   # left-center
      slot_6: {center: [1239, 320], bbox: [1159, 240, 1319, 400]}   # upper-left

    # W-Engine slot (center of the hexagon).
    engine_slot:
      center: [1398, 515]
      bbox:   [1318, 435, 1478, 595]
      note: "H11/H12 live 2026-06-07. Hexagon center (disc-symmetry center ≈1398,538)."

    # Render-gate parameters (H3, thresholds re-tuned H11 for an EQUIPPED engine).
    render_gate:
      engine_sample_center:  [1398, 515]
      engine_sample_radius:  20
      engine_luma_min:       80     # live equipped engine ≈125; base ≈33, skills ≈46 (empty ref_7 slot ≈198)
      slot_panel_bbox:       [610, 120, 965, 210]
      slot_panel_dark_frac:  0.08   # open: ≈0.16; no-panel (portrait): ≈0.01

    # When a slot is clicked (ref_9/ref_10), a disc detail panel opens in the CENTER.
    # Confirmed from pixel analysis 2026-06-04 (ref_9 = Bunny in Wonderland [1],
    # ref_10 = Astral Voice [1]).
    #
    # IMPORTANT — VARIABLE LAYOUT: field y-positions shift with title line count.
    #   1-line title (e.g. "Astral Voice [1]"):  main stat name at y≈284
    #   2-line title (e.g. "Bunny in Wonderland [1]"): main stat name at y≈316 (+32px)
    # Fixed-coordinate crops are unreliable. USE STRUCTURE-FIRST OCR PARSING instead:
    #   1. OCR the full panel (x=610-965, y=120-620) with PSM 6.
    #   2. Find "Main Stat" text anchor → name+value follow on the next non-empty line.
    #   3. Find "Sub-Stats" text anchor → up to 4 name/value rows follow.
    #   4. Stop at "Set Effect" anchor (not needed for ZOD output).
    #
    # Lock icon appears on disc THUMBNAILS in the left selection grid (to the right of
    # the "Lv. N" text — present=locked, absent=unlocked). Read lock state from the
    # inventory scan (C2/D2), not from this panel.
    slot_detail_panel:
      panel_bbox: [610, 120, 965, 620]

      # Fixed fields (title and rarity/level row — these DO have stable positions):
      fixed_fields:
        # Full title "SetName [N]" — strip " [N]" suffix for set name, parse N for slot.
        # x-range confirmed; y-top is always ≈120. Title may be 1 or 2 lines.
        set_name_with_slot:
          bbox: [610, 120, 965, 210]
          preprocess: white_text_on_dark

        # Rarity circle (gold/purple/blue) at left edge of level row (just below title).
        rarity_badge:
          bbox: [610, 210, 648, 260]
          preprocess: color_sample
          colors: {S: [228, 165, 54], A: [160, 80, 220], B: [80, 140, 200]}

        # "Lv. 15/15" — read first integer only (current level).
        level:
          bbox: [648, 210, 965, 260]
          preprocess: white_text_on_dark

      # Variable fields — use structure-first OCR on the full body crop:
      body_crop_for_parsing:
        bbox: [610, 260, 965, 620]   # below level row; contains Main Stat + Sub-Stats
        preprocess: white_text_on_dark
        parse_strategy: >
          OCR full crop with PSM 6. Find "Main Stat" line → next line = "Name  Value".
          Find "Sub-Stats" line → next 1-4 lines = "Name [+N]  Value" each.
          Stop parsing at "Set Effect". Values are right-aligned (x≈920-965 in game coords).

      # Substat row y-offsets from the "Sub-Stats" header, for implementations that
      # prefer crop-per-row over full-panel OCR (confirmed from ref_9/ref_10):
      substat_row_pitch: 52    # px between substat rows
      value_x_range: [920, 965]   # right-aligned value column (game coords)

# ─────────────────────────────────────────────
# AGENT MENU  (ref_12, ref_13, ref_14)
# ─────────────────────────────────────────────
# Measured 2026-06-06. All coords in game-area pixels (1920×1080 ref).
# Raw screenshots are 1922×1112; game-area = raw - (1, 32).
agent_menu:
  # 2-column owned-agent roster grid on the right side of the screen.
  # Ownership filter: 75th-percentile HSV saturation over full column width > threshold.
  # Owned portraits are colorful (high S); locked/EMPTY are desaturated (low S).
  roster_grid:
    left_col:  {x0: 1277, x1: 1537, cx: 1407}
    right_col: {x0: 1537, x1: 1797, cx: 1667}
    row_centers: [144, 402, 660, 918]   # cy of each visible row
    row_stride: 258                     # px between row centers
    row_half_height: 100                # ±px around cy for saturation sampling
    sat_p75_threshold: 15               # 75th-percentile S > this → owned

  # Detail-page tab bar (bottom bar, active when viewing agent detail).
  # Measured from archive/live_20260605/agent_000/base_stats.png.
  # Active tab highlighted yellow.
  detail_tabs:
    base_stats: {center: [1152, 996], bbox: [1011, 964, 1294, 1028]}
    skills:     {center: [1435, 996], bbox: [1294, 964, 1577, 1028]}
    equipment:  {center: [1718, 996], bbox: [1577, 964, 1900, 1028]}

  # Bottom navigation bar (ref_11 main hub).
  # Measured 2026-06-11 from reference_11_main_menu.png via OCR of the text label row
  # (game_y=1041, the centre of the icon-label strip).
  # Full icon+label spans roughly y=1025-1055; y=1041 is a safe click target.
  bottom_nav:
    # Updated 2026-06-15: ZZZ 1.5 added Achievements (6th item), shifting right.
    storage:  {center: [1178, 1041]}   # 8th item (was 1123 pre-1.5)
    agents:   {center: [1274, 1041]}   # 9th item (was 1251 pre-1.5)

    # OCR-locate band: crop this strip from a main-menu frame, 3× upscale, threshold,
    # then run pytesseract PSM 11 to locate word centers. Used to auto-adapt to layout
    # drift when ZZZ adds new nav items. Hard-coded centers above are the fallback.
    ocr_band:      [900, 1015, 1400, 1062]   # game-area coords (x0,y0,x1,y1)
    ocr_upscale:   3
    ocr_threshold: 90    # binary threshold for white label text

# ─────────────────────────────────────────────
# SCREEN SIGNATURES  (used by assert_screen / active_screen)
# ─────────────────────────────────────────────
# Each signature is a bbox + threshold check on a region that is bright ONLY on
# that screen and dark / absent on all other target screens.
# Measured 2026-06-11 from reference_11/12/1/2.  All bboxes in game-area coords.
screen_signatures:
  main_menu:
    # The bottom navigation icon-label strip (Storage/Agents/Store text row).
    # Present only on the main-menu hub; black on all storage/agent screens.
    #   ref_11 (main menu):   mean_luma = 55.2
    #   ref_12 (agent menu):  mean_luma =  0.1
    #   ref_1  (disc menu):   mean_luma =  0.0
    #   ref_2  (engine menu): mean_luma =  0.0
    sample_bbox: [1000, 1033, 1300, 1050]
    check: mean_luma
    threshold: 20        # > threshold → main menu confirmed

  agent_selection_menu:
    # The full-height "SELECT" band at the far-right edge of the agent grid.
    #
    # RETIRED 2026-07-30 — the old hue test (sample_bbox [1888,430,1920,570],
    # teal_pixel_count > 1000, teal = G-R > 30 AND G > 100) is UNSOUND: the band is
    # tinted by whichever agent is selected, and every calibration frame happened to
    # have Zhao (Ice) selected.
    #   ref_12/13 (Zhao, Ice):       band RGB (62,150,148)  teal_px = 4480  → pass
    #   ref_14    (Astra Yao):       band RGB (157,164,167) teal_px =    0  → FALSE NEG
    # ref_14 is an agent-selection menu.  This is what failed the 2026-07-29 run once
    # ZZZ 3.1 added Remielle and the screen no longer opened on an Ice agent.
    #
    # Replacement is hue-free: the band is uniformly bright over its whole height
    # whatever its tint.  Measure the fraction of rows whose mean luma exceeds 80.
    #   agent menus (ref_12/13/14, preflight_agents, nav_enter_pre):  100%
    #   main menu   (ref_11, nav_pre_agents, nav_pre_storage):      82-85%
    #   every other screen (disc/engine/equipment/agent detail):        0%
    # Main-menu frames light the right edge with background art, so the main_menu
    # signature above must be checked first and veto.
    sample_bbox: [1888, 100, 1920, 1000]
    check: lit_row_fraction   # row counts as lit when its mean luma > 80
    threshold: 0.95      # >= threshold AND NOT main_menu → agent selection menu

